name: Daily Meta Report

on:
  schedule:
    # 17:59 UTC = 23:59 Bangladesh Time (UTC+6)
    - cron: "59 17 * * *"
  workflow_dispatch:

jobs:
  trigger-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway report endpoint
        run: |
          curl --fail --show-error --silent "https://cheero-bot-production.up.railway.app/run-report"

  # GitHub disables scheduled workflows after 60 days without repo activity.
  # This keeps the schedule alive via the API (no dummy commits).
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: gautamkrishnar/keepalive-workflow@v2
