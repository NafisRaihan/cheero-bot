name: Daily Meta Report

# The nightly 23:59 BD report is scheduled inside the Railway app (app.py),
# because GitHub's cron ran up to 4 hours late. This workflow is a manual
# backup: Actions -> Daily Meta Report -> Run workflow.
on:
  workflow_dispatch:

jobs:
  trigger-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway report endpoint
        run: |
          curl --fail --show-error --silent "https://cheero-bot-production.up.railway.app/run-report"
